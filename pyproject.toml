[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "depi-noshow-ml"
version = "0.1.0"
description = "Exportación reproducible del dataset histórico de inasistencias DEPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
depi-ml = "depi_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

