services:
  postgres:
    image: postgres:18.4
    container_name: depi_noshow
    restart: unless-stopped
    environment:
      POSTGRES_DB: depi-noshow-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:      
      - ./docker/postgres/data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d 'depi-noshow-db'"]
      interval: 10s
      timeout: 5s
      retries: 5
